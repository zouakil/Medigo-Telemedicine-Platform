name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: python -m pip check
      - run: python backend/manage.py check --settings=config.test_settings
      - run: python backend/manage.py makemigrations --check --dry-run --settings=config.test_settings
      - run: python backend/manage.py test apps --settings=config.test_settings
